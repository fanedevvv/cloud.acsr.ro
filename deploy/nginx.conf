upstream cloud_app {
    server 127.0.0.1:4300;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cloud.acsr.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cloud.acsr.ro;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/cloud.acsr.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.acsr.ro/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Trebuie >= MAX_UPLOAD_MB din .env
    client_max_body_size 61000m;
    # Conexiuni de telefon lente: dă timp trupului cererii să ajungă (default 60s -> 408)
    client_body_timeout 300s;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://cloud_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload-uri mari: nu tampona pe disc în nginx, lasă timp serverului
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
