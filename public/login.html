<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Conectare — Cloud</title>
  <script src="/assets/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="stylesheet" href="/assets/styles.css?v=72">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card" autocomplete="on">
    <img class="brand-logo login-logo" src="/assets/logo-wordmark.png" alt="ACSR Cloud">
    <p class="muted">Conectează-te în contul tău.</p>

    <a id="googleBtn" class="google-btn" href="/auth/google" hidden>
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuă cu Google
    </a>
    <div id="orSep" class="login-or" hidden><span>sau</span></div>

    <input type="text" id="username" name="username" placeholder="Utilizator" autocomplete="username" autocapitalize="none" required>
    <input type="password" id="password" name="password" placeholder="Parolă" autocomplete="current-password" required>
    <div id="twofaBox" class="twofa-box" hidden>
      <p class="muted">Introdu codul din aplicația de autentificare (sau un cod de rezervă).</p>
      <input type="text" id="twofaCode" name="twofaCode" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" maxlength="12">
    </div>
    <button type="submit" id="submitBtn">Intră</button>
    <p id="err" class="err" role="alert" hidden></p>
    <p id="loginHint" class="muted login-hint">Nu ai cont? <a href="/register">Creează unul</a>. Poți lăsa utilizatorul gol și folosi parola veche de administrator.</p>
  </form>
  <script src="/assets/login.js?v=72"></script>
</body>
</html>
