<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Autentificare — Cloud</title>
  <script src="/assets/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/styles.css?v=15">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card" autocomplete="on">
    <h1>Cloud</h1>
    <p class="muted">Introdu parola pentru a continua.</p>
    <input type="password" id="password" name="password" placeholder="Parolă"
           autocomplete="current-password" required autofocus>
    <button type="submit">Intră</button>
    <p id="err" class="err" role="alert" hidden></p>
  </form>
  <script src="/assets/login.js?v=15"></script>
</body>
</html>
