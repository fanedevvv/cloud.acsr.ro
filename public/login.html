<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cont — Cloud</title>
  <script src="/assets/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/styles.css?v=54">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card" autocomplete="on">
    <h1>Cloud</h1>
    <div class="login-tabs">
      <button type="button" id="tabLogin" class="on">Conectare</button>
      <button type="button" id="tabReg">Cont nou</button>
    </div>

    <input type="text" id="username" name="username" placeholder="Utilizator" autocomplete="username" autocapitalize="none">
    <input type="text" id="displayName" name="displayName" placeholder="Numele afișat (ex: Ana Pop)" autocomplete="name" hidden>
    <input type="password" id="password" name="password" placeholder="Parolă" autocomplete="current-password" required>

    <button type="submit" id="submitBtn">Intră</button>
    <p id="err" class="err" role="alert" hidden></p>
    <p class="muted login-hint" id="adminHint">Poți lăsa utilizatorul gol și folosi doar parola veche de administrator.</p>
  </form>
  <script src="/assets/login.js?v=54"></script>
</body>
</html>
