<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Conectare — Cloud</title>
  <script src="/assets/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="stylesheet" href="/assets/styles.css?v=89">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card" autocomplete="on">
    <img class="brand-logo login-logo" src="/assets/logo-wordmark.png" alt="ACSR Cloud">
    <p class="muted">Conectează-te ca să încarci sau să faci albume.</p>

    <input type="text" id="username" name="username" placeholder="Utilizator (lasă gol; „admin" pentru administrare)" autocomplete="username" autocapitalize="none">
    <input type="password" id="password" name="password" placeholder="Parolă" autocomplete="current-password" required autofocus>
    <button type="submit" id="submitBtn">Intră</button>
    <p id="err" class="err" role="alert" hidden></p>
    <p class="muted login-hint">Pozele și albumele se văd fără cont. Contul e necesar doar pentru încărcare și editare.</p>
  </form>
  <script src="/assets/login.js?v=89"></script>
</body>
</html>
