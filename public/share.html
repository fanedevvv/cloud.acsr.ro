<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Album partajat — Cloud</title>
  <!--OG-->
  <script src="/assets/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/styles.css?v=50">
</head>
<body class="sh-body">
  <div id="loading" class="sh-loading"><span class="msi">progress_activity</span></div>

  <div id="album" hidden>
    <section class="sh-hero">
      <img id="heroImg" class="sh-hero-img" alt="">
      <div class="sh-hero-scrim"></div>
      <div class="sh-hero-bar">
        <a class="sh-round" href="/" aria-label="Închide"><span class="msi">arrow_back</span></a>
        <div class="spacer"></div>
        <button class="sh-round" id="slideBtn" aria-label="Slideshow"><span class="msi">play_arrow</span></button>
        <button class="sh-round" id="copyBtn" aria-label="Copiază linkul"><span class="msi">link</span></button>
      </div>
      <div class="sh-hero-text">
        <h1 id="albumTitle"></h1>
        <div id="heroDate" class="sh-hero-date"></div>
        <div class="sh-hero-chip"><span class="msi">group</span> Album partajat</div>
      </div>
    </section>

    <div id="grid" class="sh-sqgrid"></div>

    <section id="social" class="sh-social" hidden>
      <div id="contribWrap" class="sh-contrib" hidden>
        <button id="contribBtn" class="sh-cbtn"><span class="msi">add_photo_alternate</span> Adaugă poze în album</button>
        <input id="contribFile" type="file" accept="image/*,video/*" multiple hidden>
        <div id="contribProg" class="sh-muted" hidden></div>
      </div>
      <h2 class="sh-sh2">Comentarii</h2>
      <div id="composer" class="sh-composer">
        <input id="cName" class="sh-cin" maxlength="40" placeholder="Numele tău" autocomplete="name">
        <textarea id="cBody" class="sh-cta" maxlength="1000" rows="2" placeholder="Scrie un comentariu…"></textarea>
        <div class="sh-crow">
          <div class="sh-reacts" id="albumReacts"></div>
          <button id="cSend" class="sh-cbtn small">Trimite</button>
        </div>
      </div>
      <div id="albumCommentList" class="sh-clist"></div>
    </section>

    <footer class="sh-foot">
      <a class="sh-brand small" href="/"><span class="mark"><span class="msi">cloud</span></span>Cloud</a>
    </footer>
  </div>

  <div id="notfound" class="empty" hidden>
    <span class="msi big">link_off</span>
    <p>Linkul nu este valid sau a fost dezactivat.</p>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-bar">
      <button class="icon-btn" data-act="close" aria-label="Înapoi"><span class="msi">arrow_back</span></button>
      <span id="lbCount" class="lb-count"></span>
      <div class="spacer"></div>
      <button class="icon-btn lb-slideshow" data-act="slideshow" aria-label="Slideshow"><span class="msi">play_arrow</span></button>
      <a id="lbDownload" class="icon-btn" download aria-label="Descarcă"><span class="msi">download</span></a>
    </div>
    <button class="icon-btn lb-nav lb-prev" data-act="prev" aria-label="Anterior"><span class="msi">chevron_left</span></button>
    <button class="icon-btn lb-nav lb-next" data-act="next" aria-label="Următor"><span class="msi">chevron_right</span></button>
    <div class="lb-stage" id="lbStage"></div>
    <div id="lbStrip" class="lb-strip"></div>
    <div id="lbSocial" class="lb-social">
      <div class="sh-reacts sh-reacts-lb" id="lbReacts"></div>
      <button id="lbCmtToggle" class="lb-cmt-toggle"><span class="msi">chat_bubble</span> <span id="lbCmtCount">0</span></button>
    </div>
    <div id="lbSheet" class="lb-sheet" hidden>
      <div class="lb-sheet-head"><span>Comentarii</span><button id="lbSheetClose" class="sh-round" aria-label="Închide"><span class="msi">close</span></button></div>
      <div id="lbSheetList" class="sh-clist"></div>
      <div class="sh-composer">
        <input id="lbcName" class="sh-cin" maxlength="40" placeholder="Numele tău" autocomplete="name">
        <textarea id="lbcBody" class="sh-cta" rows="2" maxlength="1000" placeholder="Comentariu…"></textarea>
        <button id="lbcSend" class="sh-cbtn small">Trimite</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/assets/share.js?v=50"></script>
</body>
</html>
