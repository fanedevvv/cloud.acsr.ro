<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cont nou — Cloud</title>
  <script src="/assets/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/styles.css?v=55">
</head>
<body class="login-body">
  <form id="regForm" class="login-card" autocomplete="on">
    <h1>Cont nou</h1>
    <p class="muted">Îți faci propriile albume; toate rămân publice.</p>

    <a id="googleBtn" class="google-btn" href="/auth/google" hidden>
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuă cu Google
    </a>
    <div id="orSep" class="login-or" hidden><span>sau</span></div>

    <input type="text" id="username" name="username" placeholder="Utilizator (litere, cifre, . _ -)" autocomplete="username" autocapitalize="none" required>
    <input type="text" id="displayName" name="displayName" placeholder="Numele afișat (ex: Ana Pop)" autocomplete="name">
    <input type="password" id="password" name="password" placeholder="Parolă (min. 6 caractere)" autocomplete="new-password" required>
    <button type="submit" id="submitBtn">Creează contul</button>
    <p id="err" class="err" role="alert" hidden></p>
    <p class="muted login-hint">Ai deja cont? <a href="/login">Conectează-te</a>.</p>
  </form>
  <script src="/assets/register.js?v=55"></script>
</body>
</html>
